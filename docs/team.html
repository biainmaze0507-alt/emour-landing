  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- ── 스타일 (읽는 순서 = 겹치는 순서) ─────────────────────────
       페이지 5장이 같은 목록을 쓴다. 스타일을 추가하면 모든 페이지에 넣어야 한다.
       ------------------------------------------------------------ -->
  <link rel="stylesheet" href="css/00-tokens.css">
  <link rel="stylesheet" href="css/01-base.css">
  <link rel="stylesheet" href="css/02-layout.css">

  <link rel="stylesheet" href="css/sections/identity.css">
  <link rel="stylesheet" href="css/sections/team.css">

  <script type="module" src="js/main.js"></script>

  <!-- 안전장치 — [data-reveal] 은 처음에 opacity:0 이라 JS 가 못 돌면 빈 화면이 남는다.
       JS 가 꺼져 있으면 html 에 .js 가 안 붙고, 모듈이 실패하면 1.8초 뒤
       .reveal-fallback 이 붙어서 숨겨 둔 내용이 그대로 보인다.
       ※ file:// 에서는 ES 모듈이 CORS 로 막힙니다. 로컬 확인은 간이 서버로 여세요. -->
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () {
      var root = document.documentElement;
      if (!root.classList.contains("is-ready")) root.classList.add("reveal-fallback");
    }, 1800);
  </script>
</head>

<body data-page="team">
  <a class="sr-only" href="#main">본문으로 건너뛰기</a>

  <div class="page-atmosphere" aria-hidden="true"></div>

  <!-- 상단바와 푸터는 js/modules/chrome.js 가 js/data/site.js 의 NAV 로 만든다. -->
  <header class="site-nav"></header>
  <div class="scroll-progress" aria-hidden="true"></div>

  <main class="page-main" id="main">

    <!-- ══════════════════════════════════════════════════════════
         페이지 머리글
         ══════════════════════════════════════════════════════════ -->
    <section class="page-hero" id="top">
      <div class="shell shell--wide" data-reveal-group="80">
        <p class="page-hero__index" data-reveal="fade">No. 05 &nbsp;Our Team</p>
        <h1 class="page-hero__title" data-reveal>여섯 사람,<br>하나의 대화</h1>
        <p class="page-hero__lead" data-reveal>역할은 나누었지만 “이 문장에 어떤 감정이 맞는가”는 끝까지 함께 이야기했습니다. 카드를 누르면 각자의 포트폴리오로 이어집니다.</p>
        <div class="page-hero__jump" data-reveal="fade">
            <a class="chip chip--brand" href="#members">팀원 소개</a>
            <a class="chip chip--brand" href="#howwework">함께 일한 방식</a>
        </div>
      </div>
    </section>

    <!-- ══════════════════════════════════════════════════════════

         값이 비어 있으면 "준비 중" 으로 표시되고 카드 크기는 그대로입니다.
         ══════════════════════════════════════════════════════════ -->
    <section class="section" id="members">
      <div class="shell shell--wide">

        <div class="section-head section-head--center" data-reveal-group>

      </div>
    </section>

    <!-- ══════════════════════════════════════════════════════════
         함께 일한 방식
         ══════════════════════════════════════════════════════════ -->
    <section class="section" id="howwework">

        <div class="section-head" data-reveal-group>

    <!-- ══════════════════════════════════════════════════════════
         마무리
         ══════════════════════════════════════════════════════════ -->

        <img class="closing__mark" src="assets/logo-mark.svg" alt="" aria-hidden="true" data-reveal="scale">

          받는 말에 <span class="mark">감정</span>을 담고, 보내는 말에 <span class="mark">정성</span>을 담아,<br>
          서로의 마음이 <span class="accent">올곧게</span> 전해지도록
