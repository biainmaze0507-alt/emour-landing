  <!-- 안전장치 — [data-reveal]은 처음에 opacity:0이라 JS가 못 돌면 빈 화면이 남는다.
       JS가 꺼져 있으면 html에 .js가 안 붙고, 모듈이 실패하면 1.8초 뒤
       .reveal-fallback이 붙어서 숨겨 둔 내용이 그대로 보인다.
       ※ file:// 에서는 ES 모듈이 CORS로 막힙니다. 로컬 확인은 간이 서버로 여세요. -->
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () {
      var root = document.documentElement;
      if (!root.classList.contains("is-ready")) root.classList.add("reveal-fallback");
    }, 1800);
  </script>
